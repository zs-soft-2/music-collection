<div
	class="view-toggle"
	role="group"
	[attr.aria-label]="'ui.collectionViewToggle.view' | transloco"
>
	@for (option of options; track option.value) {
		<button
			type="button"
			[attr.aria-pressed]="view() === option.value"
			[attr.aria-label]="option.labelKey | transloco"
			[title]="option.labelKey | transloco"
			(click)="view.set(option.value)"
		>
			<i [class]="option.icon" aria-hidden="true"></i>
		</button>
	}
</div>
