@if (params$ | async; as params) {
<section class="document-table">
	<p-table
		[value]="params.documents"
		styleClass="p-datatable-striped p-datatable-sm"
		responsiveLayout="scroll"
		[paginator]="true"
		[rows]="10"
	>
		<ng-template #header>
			<tr>
				<th>Name</th>

				<th>Original name</th>

				<th></th>
			</tr>

			<tr>
				<th>
					<p-autocomplete
						[suggestions]="params.empty"
						[showClear]="true"
						(completeMethod)="searchHandler($event)"
						[minQueryLength]="3"
						[delay]="400"
						class="p-inputtext-sm"
					>
					</p-autocomplete>
				</th>

				<th></th>

				<th></th>
			</tr>
		</ng-template>

		<ng-template #body let-document>
			<tr>
				<td>{{ document.name }}</td>

				<td>{{ document.originalName }}</td>

				<td>
					<button
						pButton
						pRipple
						aria-label="Edit document"
						class="p-button-rounded p-button-success mr-2"
						(click)="editDocument(document)"
						iconOnly
					>
						<i class="pi pi-pencil" aria-hidden="true"></i>
					</button>
					<button
						pButton
						pRipple
						aria-label="Delete document"
						class="p-button-rounded p-button-warning"
						(click)="deleteDocument(document)"
						iconOnly
					>
						<i class="pi pi-trash" aria-hidden="true"></i>
					</button>
				</td>
			</tr>
		</ng-template>
	</p-table>
</section>
}
