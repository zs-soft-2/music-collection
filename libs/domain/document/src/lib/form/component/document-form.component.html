@if (params$ | async; as params) {
	<section class="document-form">
		<form class="mc-form" [formGroup]="params.formGroup">
			<input name="uid" formControlName="uid" hidden />

			<section class="mc-form-section" aria-labelledby="document-file">
				<h2 id="document-file">File</h2>
				<div class="mc-field">
					<label for="name">Name</label>
					<input
						id="name"
						type="text"
						pInputText
						formControlName="name"
					/>
				</div>

				<div class="mc-field">
					<span class="mc-field-label">Upload</span>
					<p-fileupload
						name="file"
						chooseLabel="Choose file"
						[customUpload]="true"
						(uploadHandler)="fileUpload($event)"
					></p-fileupload>
				</div>

				@if (params.formGroup.value.filePath) {
					<p-image
						class="mc-form-image"
						[src]="params.formGroup.value.filePath"
						[preview]="true"
						alt="Uploaded file preview"
						width="250"
					></p-image>
				}
			</section>

			<section class="mc-form-section" aria-labelledby="document-meta">
				<h2 id="document-meta">Stored file</h2>
				<div class="mc-form-grid">
					<div class="mc-field is-wide">
						<label for="filePath">File path</label>
						<input
							id="filePath"
							type="text"
							pInputText
							formControlName="filePath"
						/>
					</div>

					<div class="mc-field">
						<label for="originalName">Original name</label>
						<input
							id="originalName"
							type="text"
							pInputText
							formControlName="originalName"
						/>
					</div>

					<div class="mc-field">
						<label for="fileType">File type</label>
						<input
							id="fileType"
							type="text"
							pInputText
							formControlName="fileType"
						/>
					</div>
				</div>
			</section>

			<div class="mc-form-actions">
				<p-button
					label="Cancel"
					severity="secondary"
					[outlined]="true"
					(onClick)="cancel()"
				></p-button>
				<p-button
					label="Save"
					icon="pi pi-check"
					[disabled]="!params.formGroup.valid"
					(onClick)="submit()"
				></p-button>
			</div>
		</form>
	</section>
}
