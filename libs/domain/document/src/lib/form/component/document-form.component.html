@if (params$ | async; as params) {
	<section class="document-form">
		<form class="mc-form" [formGroup]="params.formGroup">
			<input name="uid" formControlName="uid" hidden />

			<section class="mc-form-section" aria-labelledby="document-file">
				<h2 id="document-file">
					{{ 'ui.documentForm.file' | transloco }}
				</h2>
				<div class="mc-field">
					<label for="name">{{
						'ui.documentForm.name' | transloco
					}}</label>
					<input
						id="name"
						type="text"
						pInputText
						formControlName="name"
					/>
				</div>

				<div class="mc-field">
					<span class="mc-field-label">{{
						'ui.documentForm.upload' | transloco
					}}</span>
					<p-fileupload
						name="file"
						chooseLabel="Choose file"
						[customUpload]="true"
						(uploadHandler)="fileUpload($event)"
					></p-fileupload>
				</div>

				@if (params.formGroup.value.filePath) {
					<p-image
						class="mc-form-image"
						[src]="params.formGroup.value.filePath"
						[preview]="true"
						[alt]="
							'ui.documentForm.uploaded-file-preview' | transloco
						"
						width="250"
					></p-image>
				}
			</section>

			<section class="mc-form-section" aria-labelledby="document-meta">
				<h2 id="document-meta">
					{{ 'ui.documentForm.stored-file' | transloco }}
				</h2>
				<div class="mc-form-grid">
					<div class="mc-field is-wide">
						<label for="filePath">{{
							'ui.documentForm.file-path' | transloco
						}}</label>
						<input
							id="filePath"
							type="text"
							pInputText
							formControlName="filePath"
						/>
					</div>

					<div class="mc-field">
						<label for="originalName">{{
							'ui.documentForm.original-name' | transloco
						}}</label>
						<input
							id="originalName"
							type="text"
							pInputText
							formControlName="originalName"
						/>
					</div>

					<div class="mc-field">
						<label for="fileType">{{
							'ui.documentForm.file-type' | transloco
						}}</label>
						<input
							id="fileType"
							type="text"
							pInputText
							formControlName="fileType"
						/>
					</div>
				</div>
			</section>

			<div class="mc-form-actions">
				<p-button
					[label]="'ui.documentForm.cancel' | transloco"
					severity="secondary"
					[outlined]="true"
					(onClick)="cancel()"
				></p-button>
				<p-button
					[label]="'ui.documentForm.save' | transloco"
					icon="pi pi-check"
					[disabled]="!params.formGroup.valid"
					(onClick)="submit()"
				></p-button>
			</div>
		</form>
	</section>
}
