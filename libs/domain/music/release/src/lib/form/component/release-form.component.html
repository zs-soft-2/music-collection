@if (params$ | async; as params) {
	<section class="release-form">
		<form class="mc-form" [formGroup]="params.formGroup">
			<input name="uid" formControlName="uid" hidden />

			<section class="mc-form-section" aria-labelledby="release-details">
				<h2 id="release-details">
					{{ 'ui.releaseForm.details' | transloco }}
				</h2>
				<div class="mc-form-grid">
					<div class="mc-field is-wide">
						<label for="name">{{
							'ui.releaseForm.name' | transloco
						}}</label>
						<input
							id="name"
							type="text"
							pInputText
							formControlName="name"
						/>
					</div>

					<div class="mc-field">
						<label for="artist">{{
							'ui.releaseForm.artist' | transloco
						}}</label>
						<p-autocomplete
							inputId="artist"
							formControlName="artist"
							[suggestions]="params.artists"
							[minQueryLength]="3"
							[delay]="400"
							optionLabel="name"
							[placeholder]="
								'ui.releaseForm.start-typing-an-artist'
									| transloco
							"
							(completeMethod)="searchArtistHandler($event)"
						></p-autocomplete>
					</div>

					<div class="mc-field">
						<label for="album">{{
							'ui.releaseForm.album' | transloco
						}}</label>
						<p-autocomplete
							inputId="album"
							formControlName="album"
							[suggestions]="params.albums"
							[minQueryLength]="3"
							[delay]="400"
							optionLabel="name"
							[placeholder]="
								'ui.releaseForm.start-typing-an-album'
									| transloco
							"
							(completeMethod)="searchAlbumHandler($event)"
						></p-autocomplete>
					</div>

					<div class="mc-field">
						<label for="label">{{
							'ui.releaseForm.label' | transloco
						}}</label>
						<p-autocomplete
							inputId="label"
							formControlName="label"
							[suggestions]="params.labels"
							[minQueryLength]="3"
							[delay]="400"
							optionLabel="name"
							[placeholder]="
								'ui.releaseForm.start-typing-a-label'
									| transloco
							"
							(completeMethod)="searchLabelHandler($event)"
						></p-autocomplete>
					</div>

					<div class="mc-field">
						<label for="date">{{
							'ui.releaseForm.date' | transloco
						}}</label>
						<p-datepicker
							inputId="date"
							formControlName="date"
						></p-datepicker>
					</div>
				</div>
			</section>

			<section class="mc-form-section" aria-labelledby="release-pressing">
				<h2 id="release-pressing">
					{{ 'ui.releaseForm.pressing' | transloco }}
				</h2>
				<div class="mc-form-grid">
					<div class="mc-field">
						<label for="media">{{
							'ui.releaseForm.media' | transloco
						}}</label>
						<p-select
							inputId="media"
							[options]="params.mediaList"
							[placeholder]="
								'ui.releaseForm.select-a-media' | transloco
							"
							formControlName="media"
						></p-select>
					</div>

					<div class="mc-field">
						<label for="country">{{
							'ui.releaseForm.country' | transloco
						}}</label>
						<p-select
							inputId="country"
							[options]="params.countryList"
							[placeholder]="
								'ui.releaseForm.select-a-country' | transloco
							"
							formControlName="country"
							[filter]="true"
						></p-select>
					</div>

					<div class="mc-field is-wide">
						<label for="formatDescription">{{
							'ui.releaseForm.format-description' | transloco
						}}</label>
						<p-multiselect
							inputId="formatDescription"
							[options]="params.formatDescriptionList"
							[placeholder]="
								'ui.releaseForm.select-a-format-description'
									| transloco
							"
							[filter]="false"
							formControlName="formatDescription"
							display="chip"
						></p-multiselect>
					</div>
				</div>
			</section>

			<div class="mc-form-actions">
				<p-button
					[label]="'ui.releaseForm.cancel' | transloco"
					severity="secondary"
					[outlined]="true"
					(onClick)="cancel()"
				></p-button>
				<p-button
					[label]="'ui.releaseForm.save' | transloco"
					icon="pi pi-check"
					[disabled]="!params.formGroup.valid"
					(onClick)="submit()"
				></p-button>
			</div>
		</form>
	</section>
}
