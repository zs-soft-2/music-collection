@if (params$ | async; as params) {
	<section class="release-form">
		<form class="mc-form" [formGroup]="params.formGroup">
			<input name="uid" formControlName="uid" hidden />

			<section class="mc-form-section" aria-labelledby="release-details">
				<h2 id="release-details">Details</h2>
				<div class="mc-form-grid">
					<div class="mc-field is-wide">
						<label for="name">Name</label>
						<input
							id="name"
							type="text"
							pInputText
							formControlName="name"
						/>
					</div>

					<div class="mc-field">
						<label for="artist">Artist</label>
						<p-autocomplete
							inputId="artist"
							formControlName="artist"
							[suggestions]="params.artists"
							[minQueryLength]="3"
							[delay]="400"
							optionLabel="name"
							placeholder="Start typing an artist…"
							(completeMethod)="searchArtistHandler($event)"
						></p-autocomplete>
					</div>

					<div class="mc-field">
						<label for="album">Album</label>
						<p-autocomplete
							inputId="album"
							formControlName="album"
							[suggestions]="params.albums"
							[minQueryLength]="3"
							[delay]="400"
							optionLabel="name"
							placeholder="Start typing an album…"
							(completeMethod)="searchAlbumHandler($event)"
						></p-autocomplete>
					</div>

					<div class="mc-field">
						<label for="label">Label</label>
						<p-autocomplete
							inputId="label"
							formControlName="label"
							[suggestions]="params.labels"
							[minQueryLength]="3"
							[delay]="400"
							optionLabel="name"
							placeholder="Start typing a label…"
							(completeMethod)="searchLabelHandler($event)"
						></p-autocomplete>
					</div>

					<div class="mc-field">
						<label for="date">Date</label>
						<p-datepicker
							inputId="date"
							formControlName="date"
						></p-datepicker>
					</div>
				</div>
			</section>

			<section class="mc-form-section" aria-labelledby="release-pressing">
				<h2 id="release-pressing">Pressing</h2>
				<div class="mc-form-grid">
					<div class="mc-field">
						<label for="media">Media</label>
						<p-select
							inputId="media"
							[options]="params.mediaList"
							placeholder="Select a media"
							formControlName="media"
						></p-select>
					</div>

					<div class="mc-field">
						<label for="country">Country</label>
						<p-select
							inputId="country"
							[options]="params.countryList"
							placeholder="Select a country"
							formControlName="country"
							[filter]="true"
						></p-select>
					</div>

					<div class="mc-field is-wide">
						<label for="formatDescription"
							>Format description</label
						>
						<p-multiselect
							inputId="formatDescription"
							[options]="params.formatDescriptionList"
							placeholder="Select a format description"
							[filter]="false"
							formControlName="formatDescription"
							display="chip"
						></p-multiselect>
					</div>
				</div>
			</section>

			<div class="mc-form-actions">
				<p-button
					label="Cancel"
					severity="secondary"
					[outlined]="true"
					(onClick)="cancel()"
				></p-button>
				<p-button
					label="Save"
					icon="pi pi-check"
					[disabled]="!params.formGroup.valid"
					(onClick)="submit()"
				></p-button>
			</div>
		</form>
	</section>
}
