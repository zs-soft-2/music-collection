@if (params$ | async; as params) {
<section class="release-list">
  @if (params.releases.length) {
    <p-carousel
      [value]="params.releases"
      [numVisible]="3"
      [numScroll]="1"
      [autoplayInterval]="5000"
      >
      <ng-template let-release #item>
        <div class="release-view">
          <mc-release-simple-view
            [release]="release"
          ></mc-release-simple-view>
        </div>
      </ng-template>
    </p-carousel>
  }
</section>
}
