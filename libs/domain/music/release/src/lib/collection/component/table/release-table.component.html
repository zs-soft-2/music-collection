@if (params$ | async; as params) {
	<section class="release-table mc-card">
		<p-table
			[value]="params.releases"
			styleClass="mc-table"
			responsiveLayout="scroll"
		>
			<ng-template #header>
				<tr>
					<th>Name</th>

					<th>Artist</th>

					<th>Date</th>

					<th>Media</th>

					<th>Format</th>

					<th></th>
				</tr>

				<tr>
					<th>
						<p-autocomplete
							placeholder="Filter by name…"
							ariaLabel="Filter by name"
							[suggestions]="params.empty"
							[showClear]="true"
							(completeMethod)="searchHandler($event)"
							[minQueryLength]="3"
							[delay]="400"
						>
						</p-autocomplete>
					</th>

					<th></th>
					<th></th>
					<th></th>
					<th></th>
					<th></th>
				</tr>
			</ng-template>

			<ng-template #body let-release>
				<tr>
					<td>{{ release.name }}</td>

					<td>{{ release.artist.name }}</td>

					<td>{{ release.date | date: 'yyyy' }}</td>

					<td>{{ release.media }}</td>

					<td>{{ release.format }}</td>

					<td>
						<button
							pButton
							pRipple
							aria-label="Edit release"
							class="p-button-text p-button-rounded p-button-secondary"
							(click)="editRelease(release)"
							iconOnly
						>
							<i class="pi pi-pencil" aria-hidden="true"></i>
						</button>

						<button
							pButton
							pRipple
							aria-label="Delete release"
							class="p-button-text p-button-rounded p-button-danger"
							(click)="deleteRelease(release)"
							iconOnly
						>
							<i class="pi pi-trash" aria-hidden="true"></i>
						</button>
					</td>
				</tr>
			</ng-template>
		</p-table>
	</section>
}
