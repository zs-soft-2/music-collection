<section class="release-edit">
	@if (isExisting) {
		<p-tabs value="details">
			<p-tablist>
				<p-tab value="details">Details</p-tab>
				<p-tab value="tracks">Tracks</p-tab>
			</p-tablist>
			<p-tabpanels>
				<p-tabpanel value="details">
					<mc-release-form></mc-release-form>
				</p-tabpanel>
				<p-tabpanel value="tracks">
					<mc-release-tracks
						[releaseId]="releaseId"
					></mc-release-tracks>
				</p-tabpanel>
			</p-tabpanels>
		</p-tabs>
	} @else {
		<mc-release-form></mc-release-form>
	}
</section>
