@if (params$ | async; as params) {
	<mc-collection-list
		[items]="params.collectionItems"
		[place]="place"
		[view]="collectionView"
		emptyMessage="No collection items found."
	>
		<p-autocomplete
			tools
			class="mc-table-search"
			placeholder="Filter by name…"
			ariaLabel="Filter by name"
			[ngModel]="place.filterOf('name')"
			[suggestions]="params.empty"
			[showClear]="true"
			(completeMethod)="searchByNameHandler($event)"
			(onClear)="clearNameSearch()"
			[minQueryLength]="3"
			[delay]="400"
		>
		</p-autocomplete>

		<p-autocomplete
			tools
			class="mc-table-search"
			placeholder="Filter by artist…"
			ariaLabel="Filter by artist"
			[ngModel]="place.filterOf('artist')"
			[suggestions]="params.empty"
			[showClear]="true"
			(completeMethod)="searchByArtistNameHandler($event)"
			(onClear)="clearArtistSearch()"
			[minQueryLength]="3"
			[delay]="400"
		>
		</p-autocomplete>

		<ng-template #card let-collectionItem>
			<mc-entity-card
				[title]="collectionItem.release?.name"
				[subtitle]="collectionItem.release?.artist?.name"
				[imageUrl]="imageOf(collectionItem)"
				imageShape="square"
				(open)="editCollectionItem(collectionItem)"
			>
				<mc-view-action
					cardActions
					[link]="viewLink(collectionItem)"
					entity="copy"
					[name]="collectionItem.release?.name"
				/>
				@if (collectionItem.date) {
					<p-chip styleClass="style">
						{{ collectionItem.date | date: 'yyyy' }}
					</p-chip>
				}

				<button
					cardActions
					pButton
					pRipple
					aria-label="Delete collection item"
					class="p-button-text p-button-rounded p-button-danger"
					(click)="deleteCollectionItem(collectionItem)"
					iconOnly
				>
					<i class="pi pi-trash" aria-hidden="true"></i>
				</button>
			</mc-entity-card>
		</ng-template>

		<ng-template mcColumn header="Name" let-collectionItem>
			{{ collectionItem.release.name }}
		</ng-template>

		<ng-template mcColumn header="Artist" let-collectionItem>
			{{ collectionItem.release.artist?.name }}
		</ng-template>

		<ng-template mcColumn header="Year" let-collectionItem>
			{{ collectionItem.date | date: 'yyyy' }}
		</ng-template>

		<ng-template
			mcColumn
			header="Updated"
			field="updatedAt"
			let-collectionItem
		>
			{{ collectionItem.updatedAt | date: 'yyyy-MM-dd HH:mm' }}
		</ng-template>

		<ng-template mcColumn header="Actions" headerHidden let-collectionItem>
			<mc-view-action
				[link]="viewLink(collectionItem)"
				entity="copy"
				[name]="collectionItem.release?.name"
			/>
			<button
				pButton
				pRipple
				aria-label="Edit collection item"
				class="p-button-text p-button-rounded p-button-secondary"
				(click)="editCollectionItem(collectionItem)"
				iconOnly
			>
				<i class="pi pi-pencil" aria-hidden="true"></i>
			</button>

			<button
				pButton
				pRipple
				aria-label="Delete collection item"
				class="p-button-text p-button-rounded p-button-danger"
				(click)="deleteCollectionItem(collectionItem)"
				iconOnly
			>
				<i class="pi pi-trash" aria-hidden="true"></i>
			</button>
		</ng-template>
	</mc-collection-list>
}
