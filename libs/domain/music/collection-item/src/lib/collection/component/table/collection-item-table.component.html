@if (params$ | async; as params) {
	<mc-collection-list
		[items]="params.collectionItems"
		[place]="place"
		[view]="collectionView"
		[emptyMessage]="
			'ui.collectionItemTable.no-collection-items-found' | transloco
		"
	>
		<p-autocomplete
			tools
			class="mc-table-search"
			[placeholder]="'ui.collectionItemTable.filter-by-name' | transloco"
			[ariaLabel]="'ui.collectionItemTable.filter-by-name2' | transloco"
			[ngModel]="place.filterOf('name')"
			[suggestions]="params.empty"
			[showClear]="true"
			(completeMethod)="searchByNameHandler($event)"
			(onClear)="clearNameSearch()"
			[minQueryLength]="3"
			[delay]="400"
		>
		</p-autocomplete>

		<p-autocomplete
			tools
			class="mc-table-search"
			[placeholder]="
				'ui.collectionItemTable.filter-by-artist' | transloco
			"
			[ariaLabel]="'ui.collectionItemTable.filter-by-artist2' | transloco"
			[ngModel]="place.filterOf('artist')"
			[suggestions]="params.empty"
			[showClear]="true"
			(completeMethod)="searchByArtistNameHandler($event)"
			(onClear)="clearArtistSearch()"
			[minQueryLength]="3"
			[delay]="400"
		>
		</p-autocomplete>

		<ng-template #card let-collectionItem>
			<mc-entity-card
				[title]="collectionItem.release?.name"
				[subtitle]="collectionItem.release?.artist?.name"
				[imageUrl]="imageOf(collectionItem)"
				imageShape="square"
				(open)="editCollectionItem(collectionItem)"
			>
				<mc-view-action
					cardActions
					[link]="viewLink(collectionItem)"
					entity="copy"
					[name]="collectionItem.release?.name"
				/>
				@if (collectionItem.date) {
					<p-chip styleClass="style">
						{{ collectionItem.date | date: 'yyyy' }}
					</p-chip>
				}

				<button
					cardActions
					pButton
					pRipple
					[attr.aria-label]="
						'ui.collectionItemTable.delete-collection-item'
							| transloco
					"
					class="p-button-text p-button-rounded p-button-danger"
					(click)="deleteCollectionItem(collectionItem)"
					iconOnly
				>
					<i class="pi pi-trash" aria-hidden="true"></i>
				</button>
			</mc-entity-card>
		</ng-template>

		<ng-template
			mcColumn
			[header]="'ui.collectionItemTable.name' | transloco"
			let-collectionItem
		>
			{{ collectionItem.release.name }}
		</ng-template>

		<ng-template
			mcColumn
			[header]="'ui.collectionItemTable.artist' | transloco"
			let-collectionItem
		>
			{{ collectionItem.release.artist?.name }}
		</ng-template>

		<ng-template
			mcColumn
			[header]="'ui.collectionItemTable.year' | transloco"
			let-collectionItem
		>
			{{ collectionItem.date | date: 'yyyy' }}
		</ng-template>

		<ng-template
			mcColumn
			[header]="'ui.collectionItemTable.updated' | transloco"
			field="updatedAt"
			let-collectionItem
		>
			{{ collectionItem.updatedAt | date: 'yyyy-MM-dd HH:mm' }}
		</ng-template>

		<ng-template
			mcColumn
			[header]="'ui.collectionItemTable.actions' | transloco"
			headerHidden
			let-collectionItem
		>
			<mc-view-action
				[link]="viewLink(collectionItem)"
				entity="copy"
				[name]="collectionItem.release?.name"
			/>
			<button
				pButton
				pRipple
				[attr.aria-label]="
					'ui.collectionItemTable.edit-collection-item' | transloco
				"
				class="p-button-text p-button-rounded p-button-secondary"
				(click)="editCollectionItem(collectionItem)"
				iconOnly
			>
				<i class="pi pi-pencil" aria-hidden="true"></i>
			</button>

			<button
				pButton
				pRipple
				[attr.aria-label]="
					'ui.collectionItemTable.delete-collection-item2' | transloco
				"
				class="p-button-text p-button-rounded p-button-danger"
				(click)="deleteCollectionItem(collectionItem)"
				iconOnly
			>
				<i class="pi pi-trash" aria-hidden="true"></i>
			</button>
		</ng-template>
	</mc-collection-list>
}
