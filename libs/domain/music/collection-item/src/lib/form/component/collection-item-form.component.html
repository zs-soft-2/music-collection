@if (params$ | async; as params) {
	<section class="collection-item-form">
		<form class="mc-form" [formGroup]="params.formGroup">
			<input name="uid" formControlName="uid" hidden />
			<input name="userId" formControlName="userId" hidden />

			<section
				class="mc-form-section"
				aria-labelledby="collection-item-details"
			>
				<h2 id="collection-item-details">Details</h2>
				<div class="mc-form-grid">
					<div class="mc-field">
						<label for="release">Release</label>
						<p-autocomplete
							inputId="release"
							formControlName="release"
							[suggestions]="params.releases"
							[minQueryLength]="3"
							[delay]="400"
							optionLabel="nameAndMedia"
							placeholder="Start typing a release…"
							(completeMethod)="searchRelease($event)"
						></p-autocomplete>
					</div>

					<div class="mc-field">
						<label for="date">Date</label>
						<p-datepicker
							inputId="date"
							formControlName="date"
						></p-datepicker>
					</div>
				</div>
			</section>

			<div class="mc-form-actions">
				<p-button
					label="Cancel"
					severity="secondary"
					[outlined]="true"
					(onClick)="cancel()"
				></p-button>
				<p-button
					label="Save"
					icon="pi pi-check"
					[disabled]="!params.formGroup.valid"
					(onClick)="submit()"
				></p-button>
			</div>
		</form>
	</section>
}
