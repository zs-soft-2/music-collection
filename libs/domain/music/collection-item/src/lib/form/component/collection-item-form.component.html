@if (params$ | async; as params) {
<section class="collection-item-form">
	<form [formGroup]="params.formGroup">
		<input name="uid" formControlName="uid" hidden />
		<input name="userId" formControlName="userId" hidden />

		<div class="field">
			<span class="p-float-label">
				<p-autocomplete
					formControlName="release"
					[suggestions]="params.releases"
					[minQueryLength]="3"
					[delay]="400"
					optionLabel="nameAndMedia"
					(completeMethod)="searchRelease($event)"
				></p-autocomplete>

				<label for="release">Release</label>
			</span>
		</div>

		<div class="field">
			<span class="p-float-label">
				<p-datepicker id="date" formControlName="date"></p-datepicker>

				<label for="date">Date</label>
			</span>
		</div>
	</form>

	<div style="margin-top: 10px" fxLayout="row" fxLayoutAlign="space-around">
		<button
			pButton
			type="button"
			(click)="submit()"
			[disabled]="!params.formGroup.valid"
		>
			Submit
		</button>

		<button
			pButton
			type="button"
			(click)="cancel()"
		>
			Cancel
		</button>
	</div>
</section>
}
