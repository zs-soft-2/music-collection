@if (params$ | async; as params) {
<section class="album-form">
  <form [formGroup]="params.formGroup">
    <p-tabs value="0">
      <p-tablist>
        <p-tab value="0">Data</p-tab>

        <p-tab value="1" [disabled]="!params.isImagesTabActive">Images</p-tab>
      </p-tablist>

      <p-tabpanels>
      <p-tabpanel value="0">
        <input name="uid" formControlName="uid" hidden />

        <div class="field">
          <span class="p-float-label">
            <p-autocomplete
              formControlName="artist"
              [suggestions]="params.artists"
              [minQueryLength]="3"
              [delay]="400"
              optionLabel="name"
              (completeMethod)="searchArtist($event)"
            ></p-autocomplete>

            <label for="artist">Artist</label>
          </span>
        </div>

        <div class="field">
          <span class="p-float-label">
            <input
              id="name"
              type="text"
              pInputText
              formControlName="name"
              />

            <label for="name">Name</label>
          </span>
        </div>

        <div class="field">
          <span class="p-float-label">
            <p-select
              id="format"
              [options]="params.formatList"
              placeholder="Select a format"
              formControlName="format"
            ></p-select>

            <label for="format">Format</label>
          </span>
        </div>

        <div class="field">
          <span class="p-float-label">
            <p-datepicker
              id="year"
              formControlName="year"
            ></p-datepicker>

            <label for="year">Year</label>
          </span>
        </div>

        <div class="field">
          <span class="p-float-label">
            <p-multiselect
              id="styles"
              [options]="params.styleList"
              [filter]="false"
              formControlName="styles"
              display="chip"
            ></p-multiselect>

            <label for="styles">Styles</label>
          </span>
        </div>
      </p-tabpanel>

      <p-tabpanel value="1">
        <div class="field">
          <span class="p-float-label">
            <p-autocomplete
              id="coverImage"
              formControlName="coverImage"
              [suggestions]="params.documents"
              [minQueryLength]="3"
              [delay]="400"
              optionLabel="name"
              (completeMethod)="searchDocument($event)"
              >
            </p-autocomplete>

            <label for="coverImage">Cover image</label>
          </span>

          @if (params.formGroup.value.coverImage) {
            <p-image
              [src]="$safeNavigationMigration(params.formGroup.value.coverImage?.filePath)"
              [preview]="true"
              alt="Image"
              width="200"
              >
            </p-image>
          }
        </div>
      </p-tabpanel>
      </p-tabpanels>
    </p-tabs>

      <div
        style="margin-top: 10px"
        fxLayout="row"
        fxLayoutAlign="space-around"
        >
        <button
          pButton
          type="button"
          (click)="submit()"
          [disabled]="!params.formGroup.valid"
        >
          Submit
        </button>

        <button
          pButton
          type="button"
          (click)="cancel()"
        >
          Cancel
        </button>
      </div>
  </form>
</section>
}
