<div class="album-item">
	<div class="album-item-content">
		<div class="cover">
			<p-image
				[src]="album.coverImage?.filePath || album.coverImageUrl || ''"
				[height]="'100'"
				[width]="width"
				[alt]="'ui.albumItemView.image' | transloco"
				styleClass="item-image"
			></p-image>
		</div>

		<div class="album-data">
			<h3>
				{{ album.name }}
			</h3>

			<div>
				{{ album.year | date: 'yyyy' }}
			</div>
		</div>
	</div>

	<div class="album-item-action">
		<p-button
			[label]="'ui.albumItemView.detail' | transloco"
			(click)="detailClickHandler()"
		>
		</p-button>
	</div>
</div>
