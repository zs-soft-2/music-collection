@if (params$ | async; as params) {
<section class="album-table">
  <p-table
    [value]="params.albums"
    [paginator]="true"
    [rows]="10"
    sortField="name"
    sortMode="multiple"
    styleClass="p-datatable-striped p-datatable-sm"
    responsiveLayout="scroll"
    >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name">
          Name <p-sorticon field="name"></p-sorticon>
        </th>

        <th pSortableColumn="artist.name">
          Artist <p-sorticon field="artist.name"></p-sorticon>
        </th>

        <th pSortableColumn="year">
          Year <p-sorticon field="year"></p-sorticon>
        </th>

        <th>Styles</th>

        <th>Cover</th>

        <th></th>
      </tr>

      <tr>
        <th>
          <p-autocomplete
            [suggestions]="params.empty"
            [showClear]="true"
            (completeMethod)="searchByNameHandler($event)"
            [minQueryLength]="3"
            [delay]="400"
            class="p-inputtext-sm"
            >
          </p-autocomplete>
        </th>

        <th>
          <p-autocomplete
            [suggestions]="params.empty"
            [showClear]="true"
            (completeMethod)="searchByArtistNameHandler($event)"
            [minQueryLength]="3"
            [delay]="400"
            class="p-inputtext-sm"
            >
          </p-autocomplete>
        </th>

        <th></th>
        <th></th>
        <th></th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-album>
      <tr>
        <td>{{ album.name }}</td>

        <td>{{ album.artist.name }}</td>

        <td>{{ album.year | date : 'yyyy' }}</td>

        <td>
          @for (style of album.styles; track style) {
            <div>
              <p-chip styleClass="style">
                {{ style }}
              </p-chip>
            </div>
          }
        </td>

        <td>
          @if (album.coverImage) {
            <i class="pi pi-image"></i>
          }
        </td>

        <td>
          <button
            pButton
            pRipple
            icon="pi pi-pencil"
            class="p-button-rounded p-button-success mr-2"
            (click)="editAlbum(album)"
          ></button>

          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-warning"
            (click)="deleteAlbum(album)"
          ></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</section>
}
