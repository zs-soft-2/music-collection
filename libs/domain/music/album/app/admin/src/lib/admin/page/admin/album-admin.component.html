<section class="entity-admin">
	<header class="mc-page-head">
		<div>
			<h1>{{ 'ui.albumAdmin.albums' | transloco }}</h1>
			<p>{{ 'ui.albumAdmin.albums-of-the-global' | transloco }}</p>
		</div>

		<div class="mc-page-actions" *ngxPermissionsOnly="buttonPermissions">
			<p-button
				[label]="'ui.albumAdmin.add-album' | transloco"
				icon="pi pi-plus"
				(onClick)="clickHandler()"
				[disabled]="(isNewEntityButtonEnabled$ | async) === false"
			></p-button>
		</div>
	</header>

	<router-outlet></router-outlet>
</section>
