<p-dialog
	[header]="'ui.artistCandidatePicker.which-artist-is-this' | transloco"
	[modal]="true"
	[visible]="!!candidates()"
	(visibleChange)="$event || closed.emit()"
	[style]="{ width: 'min(44rem, 95vw)' }"
	[dismissableMask]="true"
>
	@if (candidates(); as rows) {
		<p class="artist-candidate-hint">
			{{
				'ui.artistCandidatePicker.several' | transloco: { hint: hint() }
			}}
		</p>
		<ul class="artist-candidates">
			@for (candidate of rows; track candidate.musicBrainzId) {
				<li>
					<button
						type="button"
						class="artist-candidate"
						(click)="picked.emit(candidate)"
					>
						<span class="artist-candidate-name">
							{{ candidate.name }}
							@if (candidate.note) {
								<em>({{ candidate.note }})</em>
							}
						</span>
						@if (candidate.details) {
							<span class="artist-candidate-details">
								{{ candidate.details }}
							</span>
						}
					</button>
					<a
						class="artist-candidate-link"
						[href]="candidate.sourceUrl"
						target="_blank"
						rel="noopener"
						>{{
							'ui.artistCandidatePicker.open-on-musicbrainz'
								| transloco
						}}</a
					>
				</li>
			}
		</ul>
	}
	<ng-template #footer>
		<p-button
			[label]="'ui.artistCandidatePicker.cancel' | transloco"
			severity="secondary"
			[outlined]="true"
			(onClick)="closed.emit()"
		></p-button>
	</ng-template>
</p-dialog>
