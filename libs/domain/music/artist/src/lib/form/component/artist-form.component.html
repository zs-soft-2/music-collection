@if (params$ | async; as params) {
	<section class="artist-form">
		<form class="mc-form" [formGroup]="params.formGroup">
			<input name="uid" formControlName="uid" hidden />

			<section class="mc-form-section" aria-labelledby="artist-details">
				<h2 id="artist-details">Details</h2>
				<div class="mc-form-grid">
					<div class="mc-field">
						<label for="name">Name</label>
						<input
							id="name"
							type="text"
							pInputText
							formControlName="name"
						/>
					</div>

					<div class="mc-field">
						<label for="country">Country</label>
						<p-select
							inputId="country"
							[options]="params.countries"
							placeholder="Select a country"
							formControlName="country"
							[filter]="true"
						></p-select>
					</div>

					<div class="mc-field">
						<label for="formedIn">Formed in</label>
						<p-datepicker
							inputId="formedIn"
							formControlName="formedIn"
						></p-datepicker>
					</div>

					<div class="mc-field">
						<label for="styles">Styles</label>
						<p-multiselect
							inputId="styles"
							[options]="params.styleList"
							[filter]="false"
							formControlName="styles"
							display="chip"
							placeholder="Select styles"
						></p-multiselect>
					</div>

					<div class="mc-field is-wide">
						<label for="description">Description</label>
						<textarea
							id="description"
							[rows]="5"
							formControlName="description"
							pTextarea
							[autoResize]="true"
						></textarea>
					</div>
				</div>
			</section>

			<section class="mc-form-section" aria-labelledby="artist-images">
				<h2 id="artist-images">Images</h2>
				@if (params.isImagesTabActive) {
					<div class="mc-form-grid">
						<div class="mc-field">
							<label for="headerImage">Header image</label>
							<p-autocomplete
								inputId="headerImage"
								formControlName="headerImage"
								[suggestions]="params.documents"
								[minQueryLength]="3"
								[delay]="400"
								optionLabel="name"
								placeholder="Search documents…"
								(completeMethod)="searchDocument($event)"
							></p-autocomplete>
							@if (params.formGroup.value.headerImage) {
								<p-image
									class="mc-form-image"
									[src]="
										$safeNavigationMigration(
											params.formGroup.value.headerImage
												?.filePath
										)
									"
									[preview]="true"
									alt="Header image"
									width="200"
								></p-image>
							}
						</div>
						<div class="mc-field">
							<label for="mainImage">Main image</label>
							<p-autocomplete
								inputId="mainImage"
								formControlName="mainImage"
								[suggestions]="params.documents"
								[minQueryLength]="3"
								[delay]="400"
								optionLabel="name"
								placeholder="Search documents…"
								(completeMethod)="searchDocument($event)"
							></p-autocomplete>
							@if (params.formGroup.value.mainImage) {
								<p-image
									class="mc-form-image"
									[src]="
										$safeNavigationMigration(
											params.formGroup.value.mainImage
												?.filePath
										)
									"
									[preview]="true"
									alt="Main image"
									width="200"
								></p-image>
							}
						</div>
					</div>
				} @else {
					<p class="mc-form-note">
						Save the artist first to attach images.
					</p>
				}
			</section>

			<div class="mc-form-actions">
				<p-button
					label="Cancel"
					severity="secondary"
					[outlined]="true"
					(onClick)="cancel()"
				></p-button>
				<p-button
					label="Save"
					icon="pi pi-check"
					[disabled]="!params.formGroup.valid"
					(onClick)="submit()"
				></p-button>
			</div>
		</form>
	</section>
}
