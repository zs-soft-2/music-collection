@if (params$ | async; as params) {
<section class="artist-form">
  <form [formGroup]="params.formGroup">
    <p-tabs value="0">
      <p-tablist>
        <p-tab value="0">Data</p-tab>

        <p-tab value="1" [disabled]="!params.isImagesTabActive">Images</p-tab>
      </p-tablist>

      <p-tabpanels>
      <p-tabpanel value="0">
        <input name="uid" formControlName="uid" hidden />

        <div class="field">
          <span class="p-float-label">
            <input
              id="name"
              type="text"
              pInputText
              formControlName="name"
              />

            <label for="name">Name</label>
          </span>
        </div>

        <div class="field">
          <span class="p-float-label">
            <textarea
              id="description"
              [rows]="5"
              [cols]="30"
              formControlName="description"
              pTextarea
              [autoResize]="true"
            ></textarea>

            <label for="description">Description</label>
          </span>
        </div>

        <div class="field">
          <span class="p-float-label">
            <p-select
              id="country"
              [options]="params.countries"
              placeholder="Select a country"
              formControlName="country"
            ></p-select>

            <label for="country">Country</label>
          </span>
        </div>

        <div class="field">
          <span class="p-float-label">
            <p-datepicker
              id="formedIn"
              formControlName="formedIn"
            ></p-datepicker>

            <label for="formedIn">Formed in</label>
          </span>
        </div>

        <div class="field">
          <span class="p-float-label">
            <p-multiselect
              id="styles"
              [options]="params.styleList"
              [filter]="false"
              formControlName="styles"
              display="chip"
            ></p-multiselect>

            <label for="styles">Styles</label>
          </span>
        </div>
      </p-tabpanel>

      <p-tabpanel value="1">
        <div class="field">
          <span class="p-float-label">
            <p-autocomplete
              id="headerImage"
              formControlName="headerImage"
              [suggestions]="params.documents"
              [minQueryLength]="3"
              [delay]="400"
              optionLabel="name"
              (completeMethod)="searchDocument($event)"
              >
            </p-autocomplete>

            <label for="headerImage">Header image</label>
          </span>

          @if (params.formGroup.value.headerImage) {
            <p-image
              [src]="$safeNavigationMigration(params.formGroup.value.headerImage?.filePath)"
              [preview]="true"
              alt="Image"
              width="200"
              >
            </p-image>
          }
        </div>

        <div class="field">
          <span class="p-float-label">
            <p-autocomplete
              id="mainImage"
              formControlName="mainImage"
              [suggestions]="params.documents"
              [minQueryLength]="3"
              [delay]="400"
              optionLabel="name"
              (completeMethod)="searchDocument($event)"
              >
            </p-autocomplete>

            <label for="mainImage">Main image</label>
          </span>

          @if (params.formGroup.value.mainImage) {
            <p-image
              [src]="$safeNavigationMigration(params.formGroup.value.mainImage?.filePath)"
              [preview]="true"
              alt="Image"
              width="200"
              >
            </p-image>
          }
        </div>
      </p-tabpanel>
      </p-tabpanels>
    </p-tabs>

      <div
        style="margin-top: 10px"
        fxLayout="row"
        fxLayoutAlign="space-around"
        >
        <button
          pButton
          type="button"
          (click)="submit()"
          [disabled]="!params.formGroup.valid"
        >
          Submit
        </button>

        <button
          pButton
          type="button"
          (click)="cancel()"
        >
          Cancel
        </button>
      </div>
  </form>
</section>
}
