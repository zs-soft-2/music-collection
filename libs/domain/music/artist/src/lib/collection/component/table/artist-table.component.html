@if (params$ | async; as params) {
<section class="artist-table">
  <p-table
    [value]="params.artists"
    sortField="name"
    sortMode="multiple"
    styleClass="p-datatable-striped p-datatable-sm"
    responsiveLayout="scroll"
    [paginator]="true"
    [rows]="10"
    >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name">
          Name <p-sorticon field="name"></p-sorticon>
        </th>

        <th pSortableColumn="formedIn">
          Formed in <p-sorticon field="formedIn"></p-sorticon>
        </th>

        <th>Styles</th>

        <th>Images</th>

        <th></th>
      </tr>
      <tr>
        <th>
          <p-autocomplete
            [suggestions]="params.empty"
            [showClear]="true"
            class="p-inputtext-sm"
            (completeMethod)="searchByNameHandler($event)"
            [minQueryLength]="3"
            [delay]="400"
            >
          </p-autocomplete>
        </th>

        <th></th>

        <th></th>

        <th></th>

        <th></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-artist>
      <tr>
        <td>{{ artist.name }}</td>

        <td>{{ artist.formedIn | date : 'yyyy' }}</td>

        <td>
          @for (style of artist.styles; track style) {
            <p-chip styleClass="style">
              {{ style }}
            </p-chip>
          }
        </td>

        <td>
          @if (artist.headerImage) {
            <i
              class="pi pi-image"
              style="color: red; margin: 1px"
            ></i>
          }

          @if (artist.mainImage) {
            <ng-container
              style="color: blue; margin: 1px"
              >
              <i class="pi pi-image"></i>
            </ng-container>
          }
        </td>

        <td>
          <button
            pButton
            pRipple
            icon="pi pi-pencil"
            aria-label="Edit artist"
            class="p-button-rounded p-button-success mr-2"
            (click)="editArtist(artist)"
          ></button>
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            aria-label="Delete artist"
            class="p-button-rounded p-button-warning"
            (click)="deleteArtist(artist)"
          ></button>

          <button
            pButton
            pRipple
            icon="pi pi-file-export"
            aria-label="Export artist"
            class="p-button-rounded p-button-warning"
            (click)="exportArtist(artist)"
          ></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</section>
}
