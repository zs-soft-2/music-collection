<section class="mc-form">
	<section class="mc-form-section" aria-labelledby="artist-import-title">
		<h2 id="artist-import-title">
			{{ 'ui.artistImport.import-artists' | transloco }}
		</h2>
		<p class="mc-form-note">
			{{ 'ui.artistImport.upload-an-artist-bundle' | transloco }}
		</p>
		<div class="mc-field">
			<span class="mc-field-label">{{
				'ui.artistImport.file' | transloco
			}}</span>
			<p-fileupload
				name="file"
				chooseLabel="Choose file"
				[customUpload]="true"
				(uploadHandler)="artistImport($event)"
			></p-fileupload>
		</div>
	</section>
</section>
