<div class="artist-edit">
	@if (isExisting) {
		<p-tabs value="details">
			<p-tablist>
				<p-tab value="details">{{
					'ui.artistEdit.details' | transloco
				}}</p-tab>
				<p-tab value="members">{{
					'ui.artistEdit.members' | transloco
				}}</p-tab>
				<p-tab value="albums">{{
					'ui.artistEdit.albums' | transloco
				}}</p-tab>
			</p-tablist>
			<p-tabpanels>
				<p-tabpanel value="details">
					<mc-artist-form></mc-artist-form>
				</p-tabpanel>
				<p-tabpanel value="members">
					<mc-artist-members
						[artistId]="artistId"
					></mc-artist-members>
				</p-tabpanel>
				<p-tabpanel value="albums">
					<mc-artist-albums [artistId]="artistId"></mc-artist-albums>
				</p-tabpanel>
			</p-tabpanels>
		</p-tabs>
	} @else {
		<mc-artist-form></mc-artist-form>
	}
</div>
