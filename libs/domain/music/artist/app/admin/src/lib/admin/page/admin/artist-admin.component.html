<section class="entity-admin">
	<header class="mc-page-head">
		<div>
			<h1>{{ 'ui.artistAdmin.artists' | transloco }}</h1>
			<p>{{ 'ui.artistAdmin.artists-and-bands-of' | transloco }}</p>
		</div>

		<div class="mc-page-actions" *ngxPermissionsOnly="buttonPermissions">
			<p-button
				[label]="'ui.artistAdmin.import-artists' | transloco"
				icon="pi pi-upload"
				severity="secondary"
				[outlined]="true"
				(onClick)="importClickHandler()"
			></p-button>
			<p-button
				[label]="'ui.artistAdmin.add-artist' | transloco"
				icon="pi pi-plus"
				(onClick)="clickHandler()"
				[disabled]="(isNewEntityButtonEnabled$ | async) === false"
			></p-button>
		</div>
	</header>

	<router-outlet></router-outlet>
</section>
