<section class="entity-admin">
	<header class="mc-page-head">
		<div>
			<h1>Artists</h1>
			<p>Artists and bands of the global catalog.</p>
		</div>

		<div class="mc-page-actions" *ngxPermissionsOnly="buttonPermissions">
			<p-button
				label="Import artists"
				icon="pi pi-upload"
				severity="secondary"
				[outlined]="true"
				(onClick)="importClickHandler()"
			></p-button>
			<p-button
				label="Add artist"
				icon="pi pi-plus"
				(onClick)="clickHandler()"
				[disabled]="(isNewEntityButtonEnabled$ | async) === false"
			></p-button>
		</div>
	</header>

	<router-outlet></router-outlet>
</section>
