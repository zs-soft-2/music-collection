@if (params$ | async; as params) {
	<section class="wishlistItem-table mc-card">
		<p-table
			[value]="params.wishlistItems"
			sortField="name"
			sortMode="multiple"
			styleClass="mc-table"
			responsiveLayout="scroll"
			[paginator]="true"
			[rows]="10"
		>
			<ng-template #header>
				<tr>
					<th pSortableColumn="albumReference.name">
						Artist name
						<p-sorticon field="albumReference"></p-sorticon>
					</th>

					<th pSortableColumn="artistReference.name">
						Album name
						<p-sorticon field="artistReference"></p-sorticon>
					</th>

					<th>Medias</th>

					<th></th>
				</tr>
				<tr>
					<th>
						<p-autocomplete
							placeholder="Filter by name…"
							ariaLabel="Filter by name"
							[suggestions]="params.empty"
							[showClear]="true"
							(completeMethod)="searchByNameHandler($event)"
							[minQueryLength]="3"
							[delay]="400"
						>
						</p-autocomplete>
					</th>

					<th></th>

					<th></th>

					<th></th>
				</tr>
			</ng-template>

			<ng-template #body let-wishlistItem>
				<tr>
					<td>{{ wishlistItem.artistReference.name }}</td>

					<td>{{ wishlistItem.albumReference.name }}</td>

					<td>
						@for (media of wishlistItem.medias; track media) {
							<p-chip styleClass="style">
								{{ media }}
							</p-chip>
						}
					</td>

					<td>
						<button
							pButton
							pRipple
							aria-label="Edit wishlist item"
							class="p-button-text p-button-rounded p-button-secondary"
							(click)="editWishlistItem(wishlistItem)"
							iconOnly
						>
							<i class="pi pi-pencil" aria-hidden="true"></i>
						</button>

						<button
							pButton
							pRipple
							aria-label="Delete wishlist item"
							class="p-button-text p-button-rounded p-button-danger"
							(click)="deleteWishlistItem(wishlistItem)"
							iconOnly
						>
							<i class="pi pi-trash" aria-hidden="true"></i>
						</button>
					</td>
				</tr>
			</ng-template>
		</p-table>
	</section>
}
