@if (params$ | async; as params) {
<section class="wishlist-item-form">
	<form [formGroup]="params.formGroup">
		<p-tabs value="0">
			<p-tablist>
				<p-tab value="0">Data</p-tab>
			</p-tablist>

			<p-tabpanels>
			<p-tabpanel value="0">
				<input name="uid" formControlName="uid" hidden />
				<input
					name="userReference"
					formControlName="userReference"
					hidden
				/>

				<div class="field">
					<span class="p-float-label">
						<p-autocomplete
							formControlName="artistReference"
							[suggestions]="params.artists"
							[minQueryLength]="3"
							[delay]="400"
							optionLabel="name"
							(completeMethod)="searchArtistHandler($event)"
						>
						</p-autocomplete>

						<label for="artistReference">Artist</label>
					</span>
				</div>

				<div class="field">
					<span class="p-float-label">
						<p-autocomplete
							formControlName="albumReference"
							[suggestions]="params.albums"
							[minQueryLength]="3"
							[delay]="400"
							optionLabel="name"
							(completeMethod)="searchAlbumHandler($event)"
						>
						</p-autocomplete>

						<label for="albumReference">Album</label>
					</span>
				</div>

				<div class="field">
					<span class="p-float-label">
						<input
							id="sourceLink"
							type="text"
							pInputText
							formControlName="sourceLink"
						/>

						<label for="sourceLink">Source link</label>
					</span>
				</div>

				<div class="field">
					<span class="p-float-label">
						<p-multiselect
							id="medias"
							[options]="params.mediaList"
							placeholder="Select medias"
							[filter]="false"
							formControlName="medias"
							display="chip"
						></p-multiselect>
						<label for="medias">Medias</label>
					</span>
				</div>

				<div class="field">
					<span class="no-float">
						<p-checkbox
							[binary]="true"
							formControlName="isActive"
							name="isActive"
							id="isActive"
						></p-checkbox>

						<label for="iaActive">Active</label>
					</span>
				</div>
			</p-tabpanel>
			</p-tabpanels>
		</p-tabs>

			<div
				style="margin-top: 10px"
				fxLayout="row"
				fxLayoutAlign="space-around"
			>
				<button
					pButton
					type="button"
					(click)="submit()"
					[disabled]="!params.formGroup.valid"
				>
					Submit
				</button>

				<button
					pButton
					type="button"
					(click)="cancel()"
				>
					Cancel
				</button>
			</div>
	</form>
</section>
}
