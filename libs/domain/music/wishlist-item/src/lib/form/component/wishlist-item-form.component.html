@if (params$ | async; as params) {
	<section class="wishlist-item-form">
		<form class="mc-form" [formGroup]="params.formGroup">
			<input name="uid" formControlName="uid" hidden />
			<input
				name="userReference"
				formControlName="userReference"
				hidden
			/>

			<section
				class="mc-form-section"
				aria-labelledby="wishlist-item-details"
			>
				<h2 id="wishlist-item-details">Details</h2>
				<div class="mc-form-grid">
					<div class="mc-field">
						<label for="artistReference">Artist</label>
						<p-autocomplete
							inputId="artistReference"
							formControlName="artistReference"
							[suggestions]="params.artists"
							[minQueryLength]="3"
							[delay]="400"
							optionLabel="name"
							placeholder="Start typing an artist…"
							(completeMethod)="searchArtistHandler($event)"
						></p-autocomplete>
					</div>

					<div class="mc-field">
						<label for="albumReference">Album</label>
						<p-autocomplete
							inputId="albumReference"
							formControlName="albumReference"
							[suggestions]="params.albums"
							[minQueryLength]="3"
							[delay]="400"
							optionLabel="name"
							placeholder="Start typing an album…"
							(completeMethod)="searchAlbumHandler($event)"
						></p-autocomplete>
					</div>

					<div class="mc-field">
						<label for="medias">Medias</label>
						<p-multiselect
							inputId="medias"
							[options]="params.mediaList"
							placeholder="Select medias"
							[filter]="false"
							formControlName="medias"
							display="chip"
						></p-multiselect>
					</div>

					<div class="mc-field">
						<label for="sourceLink">Source link</label>
						<input
							id="sourceLink"
							type="url"
							pInputText
							formControlName="sourceLink"
						/>
					</div>

					<div class="mc-check is-wide">
						<p-checkbox
							[binary]="true"
							formControlName="isActive"
							name="isActive"
							inputId="isActive"
						></p-checkbox>
						<label for="isActive"
							>Active — still looking for it</label
						>
					</div>
				</div>
			</section>

			<div class="mc-form-actions">
				<p-button
					label="Cancel"
					severity="secondary"
					[outlined]="true"
					(onClick)="cancel()"
				></p-button>
				<p-button
					label="Save"
					icon="pi pi-check"
					[disabled]="!params.formGroup.valid"
					(onClick)="submit()"
				></p-button>
			</div>
		</form>
	</section>
}
