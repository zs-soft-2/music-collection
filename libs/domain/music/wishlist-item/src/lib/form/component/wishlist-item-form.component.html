@if (params$ | async; as params) {
	<section class="wishlist-item-form">
		<form class="mc-form" [formGroup]="params.formGroup">
			<input name="uid" formControlName="uid" hidden />
			<input
				name="userReference"
				formControlName="userReference"
				hidden
			/>

			<section
				class="mc-form-section"
				aria-labelledby="wishlist-item-details"
			>
				<h2 id="wishlist-item-details">
					{{ 'ui.wishlistItemForm.details' | transloco }}
				</h2>
				<div class="mc-form-grid">
					<div class="mc-field">
						<label for="artistReference">{{
							'ui.wishlistItemForm.artist' | transloco
						}}</label>
						<p-autocomplete
							inputId="artistReference"
							formControlName="artistReference"
							[suggestions]="params.artists"
							[minQueryLength]="3"
							[delay]="400"
							optionLabel="name"
							[placeholder]="
								'ui.wishlistItemForm.start-typing-an-artist'
									| transloco
							"
							(completeMethod)="searchArtistHandler($event)"
						></p-autocomplete>
					</div>

					<div class="mc-field">
						<label for="albumReference">{{
							'ui.wishlistItemForm.album' | transloco
						}}</label>
						<p-autocomplete
							inputId="albumReference"
							formControlName="albumReference"
							[suggestions]="params.albums"
							[minQueryLength]="3"
							[delay]="400"
							optionLabel="name"
							[placeholder]="
								'ui.wishlistItemForm.start-typing-an-album'
									| transloco
							"
							(completeMethod)="searchAlbumHandler($event)"
						></p-autocomplete>
					</div>

					<div class="mc-field">
						<label for="medias">{{
							'ui.wishlistItemForm.medias' | transloco
						}}</label>
						<p-multiselect
							inputId="medias"
							[options]="params.mediaList"
							[placeholder]="
								'ui.wishlistItemForm.select-medias' | transloco
							"
							[filter]="false"
							formControlName="medias"
							display="chip"
						></p-multiselect>
					</div>

					<div class="mc-field">
						<label for="sourceLink">{{
							'ui.wishlistItemForm.source-link' | transloco
						}}</label>
						<input
							id="sourceLink"
							type="url"
							pInputText
							formControlName="sourceLink"
						/>
					</div>

					<div class="mc-check is-wide">
						<p-checkbox
							[binary]="true"
							formControlName="isActive"
							name="isActive"
							inputId="isActive"
						></p-checkbox>
						<label for="isActive">{{
							'ui.wishlistItemForm.active-still-looking-for'
								| transloco
						}}</label>
					</div>
				</div>
			</section>

			<div class="mc-form-actions">
				<p-button
					[label]="'ui.wishlistItemForm.cancel' | transloco"
					severity="secondary"
					[outlined]="true"
					(onClick)="cancel()"
				></p-button>
				<p-button
					[label]="'ui.wishlistItemForm.save' | transloco"
					icon="pi pi-check"
					[disabled]="!params.formGroup.valid"
					(onClick)="submit()"
				></p-button>
			</div>
		</form>
	</section>
}
