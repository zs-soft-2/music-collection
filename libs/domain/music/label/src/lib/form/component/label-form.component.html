@if (params$ | async; as params) {
	<section class="label-form">
		<form class="mc-form" [formGroup]="params.formGroup">
			<input name="uid" formControlName="uid" hidden />

			<section class="mc-form-section" aria-labelledby="label-details">
				<h2 id="label-details">Details</h2>
				<div class="mc-form-grid">
					<div class="mc-field">
						<label for="name">Name</label>
						<input
							id="name"
							type="text"
							pInputText
							formControlName="name"
						/>
					</div>

					<div class="mc-field">
						<label for="parent">Parent label</label>
						<p-autocomplete
							inputId="parent"
							formControlName="parent"
							[suggestions]="params.labels"
							[minQueryLength]="3"
							[delay]="400"
							optionLabel="name"
							placeholder="Start typing a label…"
							(completeMethod)="searchLabel($event)"
						></p-autocomplete>
					</div>
				</div>
			</section>

			<div class="mc-form-actions">
				<p-button
					label="Cancel"
					severity="secondary"
					[outlined]="true"
					(onClick)="cancel()"
				></p-button>
				<p-button
					label="Save"
					icon="pi pi-check"
					[disabled]="!params.formGroup.valid"
					(onClick)="submit()"
				></p-button>
			</div>
		</form>
	</section>
}
