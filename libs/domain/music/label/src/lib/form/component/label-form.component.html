@if (params$ | async; as params) {
<section class="label-form">
	<form [formGroup]="params.formGroup">
		<input name="uid" formControlName="uid" hidden />

		<div class="field">
			<span class="p-float-label">
				<p-autocomplete
					formControlName="parent"
					[suggestions]="params.labels"
					[minQueryLength]="3"
					[delay]="400"
					field="name"
					(completeMethod)="searchLabel($event)"
				></p-autocomplete>

				<label for="parent">Parent</label>
			</span>
		</div>

		<div class="field">
			<span class="p-float-label">
				<input
					id="name"
					type="text"
					pInputText
					formControlName="name"
				/>

				<label for="name">Name</label>
			</span>
		</div>
	</form>

	<div style="margin-top: 10px" fxLayout="row" fxLayoutAlign="space-around">
		<button
			pButton
			type="button"
			label="Submit"
			(click)="submit()"
			[disabled]="!params.formGroup.valid"
		></button>

		<button
			pButton
			type="button"
			label="Cancel"
			(click)="cancel()"
		></button>
	</div>
</section>
}
