@if (params$ | async; as params) {
	<mc-collection-list
		[items]="params.labels"
		[place]="place"
		[view]="collectionView"
		[emptyMessage]="'ui.labelTable.no-labels-found' | transloco"
	>
		<p-autocomplete
			tools
			class="mc-table-search"
			[placeholder]="'ui.labelTable.filter-by-name' | transloco"
			[ariaLabel]="'ui.labelTable.filter-by-name2' | transloco"
			[ngModel]="place.filterOf('name')"
			[suggestions]="params.empty"
			[showClear]="true"
			(completeMethod)="searchHandler($event)"
			(onClear)="clearSearch()"
			[minQueryLength]="3"
			[delay]="400"
		>
		</p-autocomplete>

		<ng-template #card let-label>
			<mc-entity-card
				[title]="label.name"
				[subtitle]="label.parent?.name"
				imageShape="square"
				(open)="editLabel(label)"
			>
				<mc-view-action
					cardActions
					[link]="viewLink(label)"
					entity="label"
					[name]="label.name"
				/>
				<button
					cardActions
					pButton
					pRipple
					[attr.aria-label]="'ui.labelTable.delete-label' | transloco"
					class="p-button-text p-button-rounded p-button-danger"
					(click)="deleteLabel(label)"
					iconOnly
				>
					<i class="pi pi-trash" aria-hidden="true"></i>
				</button>
			</mc-entity-card>
		</ng-template>

		<ng-template
			mcColumn
			[header]="'ui.labelTable.name' | transloco"
			let-label
		>
			{{ label.name }}
		</ng-template>

		<ng-template
			mcColumn
			[header]="'ui.labelTable.parent' | transloco"
			let-label
		>
			{{ label.parent?.name }}
		</ng-template>

		<ng-template
			mcColumn
			[header]="'ui.labelTable.updated' | transloco"
			field="updatedAt"
			let-label
		>
			{{ label.updatedAt | date: 'yyyy-MM-dd HH:mm' }}
		</ng-template>

		<ng-template
			mcColumn
			[header]="'ui.labelTable.actions' | transloco"
			headerHidden
			let-label
		>
			<mc-view-action
				[link]="viewLink(label)"
				entity="label"
				[name]="label.name"
			/>
			<button
				pButton
				pRipple
				[attr.aria-label]="'ui.labelTable.edit-label' | transloco"
				class="p-button-text p-button-rounded p-button-secondary"
				(click)="editLabel(label)"
				iconOnly
			>
				<i class="pi pi-pencil" aria-hidden="true"></i>
			</button>

			<button
				pButton
				pRipple
				[attr.aria-label]="'ui.labelTable.delete-label2' | transloco"
				class="p-button-text p-button-rounded p-button-danger"
				(click)="deleteLabel(label)"
				iconOnly
			>
				<i class="pi pi-trash" aria-hidden="true"></i>
			</button>
		</ng-template>
	</mc-collection-list>
}
