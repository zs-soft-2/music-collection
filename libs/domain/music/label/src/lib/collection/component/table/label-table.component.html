@if (params$ | async; as params) {
	<section class="label-table mc-card">
		<p-table
			[value]="params.labels"
			styleClass="mc-table"
			responsiveLayout="scroll"
		>
			<ng-template #header>
				<tr>
					<th>Name</th>

					<th>Parent</th>

					<th></th>
				</tr>

				<tr>
					<th>
						<p-autocomplete
							placeholder="Filter by name…"
							ariaLabel="Filter by name"
							[suggestions]="params.empty"
							[showClear]="true"
							(completeMethod)="searchHandler($event)"
							[minQueryLength]="3"
							[delay]="400"
						>
						</p-autocomplete>
					</th>

					<th></th>

					<th></th>
				</tr>
			</ng-template>

			<ng-template #body let-label>
				<tr>
					<td>{{ label.name }}</td>

					<td>{{ label.parent?.name }}</td>

					<td>
						<button
							pButton
							pRipple
							aria-label="Edit label"
							class="p-button-text p-button-rounded p-button-secondary"
							(click)="editLabel(label)"
							iconOnly
						>
							<i class="pi pi-pencil" aria-hidden="true"></i>
						</button>

						<button
							pButton
							pRipple
							aria-label="Delete label"
							class="p-button-text p-button-rounded p-button-danger"
							(click)="deleteLabel(label)"
							iconOnly
						>
							<i class="pi pi-trash" aria-hidden="true"></i>
						</button>
					</td>
				</tr>
			</ng-template>
		</p-table>
	</section>
}
