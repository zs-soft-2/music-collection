@if (params$ | async; as params) {
	<mc-collection-list
		[items]="params.labels"
		[place]="place"
		[view]="collectionView"
		emptyMessage="No labels found."
	>
		<p-autocomplete
			tools
			class="mc-table-search"
			placeholder="Filter by name…"
			ariaLabel="Filter by name"
			[ngModel]="place.filterOf('name')"
			[suggestions]="params.empty"
			[showClear]="true"
			(completeMethod)="searchHandler($event)"
			(onClear)="clearSearch()"
			[minQueryLength]="3"
			[delay]="400"
		>
		</p-autocomplete>

		<ng-template #card let-label>
			<mc-entity-card
				[title]="label.name"
				[subtitle]="label.parent?.name"
				imageShape="square"
				(open)="editLabel(label)"
			>
				<mc-view-action
					cardActions
					[link]="viewLink(label)"
					entity="label"
					[name]="label.name"
				/>
				<button
					cardActions
					pButton
					pRipple
					aria-label="Delete label"
					class="p-button-text p-button-rounded p-button-danger"
					(click)="deleteLabel(label)"
					iconOnly
				>
					<i class="pi pi-trash" aria-hidden="true"></i>
				</button>
			</mc-entity-card>
		</ng-template>

		<ng-template mcColumn header="Name" let-label>
			{{ label.name }}
		</ng-template>

		<ng-template mcColumn header="Parent" let-label>
			{{ label.parent?.name }}
		</ng-template>

		<ng-template mcColumn header="Updated" field="updatedAt" let-label>
			{{ label.updatedAt | date: 'yyyy-MM-dd HH:mm' }}
		</ng-template>

		<ng-template mcColumn header="Actions" headerHidden let-label>
			<mc-view-action
				[link]="viewLink(label)"
				entity="label"
				[name]="label.name"
			/>
			<button
				pButton
				pRipple
				aria-label="Edit label"
				class="p-button-text p-button-rounded p-button-secondary"
				(click)="editLabel(label)"
				iconOnly
			>
				<i class="pi pi-pencil" aria-hidden="true"></i>
			</button>

			<button
				pButton
				pRipple
				aria-label="Delete label"
				class="p-button-text p-button-rounded p-button-danger"
				(click)="deleteLabel(label)"
				iconOnly
			>
				<i class="pi pi-trash" aria-hidden="true"></i>
			</button>
		</ng-template>
	</mc-collection-list>
}
