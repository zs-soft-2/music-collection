name: CI

# Egyetlen workflow, hogy a deploy a build-test job sikerére várhasson (`needs:`).
# Külön workflow-k között nincs függés, így korábban a piros teszt mellett is
# kiment a deploy.
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@zssz-soft'
          always-auth: true
          cache-dependency-path: |
            package-lock.json
            apps/functions/package-lock.json
      # A @zssz-soft csomagok (a vezetett bemutató motorja) GitHub Packages
      # registryről jönnek, ami tokent kér — és a repo nem a @zssz-soft org
      # alatt van, ezért a workflow saját GITHUB_TOKEN-je nem nyitja. A
      # GH_PACKAGES_TOKEN secret kell hozzá, `read:packages` joggal.
      #
      # Külön lépésben, mert enélkül az `npm ci` egy 401-gyel áll meg, amiből
      # nem látszik, hogy egy hiányzó secretről van szó.
      - name: Csomag-registry token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Hiányzik a GH_PACKAGES_TOKEN (vagy NPM_TOKEN) secret — a @zssz-soft csomagokhoz read:packages jogú PAT kell."
            exit 1
          fi
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.NPM_TOKEN }}
      # A functions a saját package.json-jéből él (külön tsc, külön függőségek),
      # így a gyökér `npm ci` nem hozza le neki a firebase-functions-t és a
      # @zssz-soft/zs-ai-sdk-t — a tesztjei enélkül fordítani sem tudnak. Az SDK
      # `file:vendor/…tgz` hivatkozás (tools/functions/vendor-ai-sdk.mjs), ezt
      # előbb le kell hozni a registryből.
      - run: node tools/functions/vendor-ai-sdk.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.NPM_TOKEN }}
      - run: npm ci --prefix apps/functions
      # A firestore-rules tesztek emulátort indítanak; a runneren nincs
      # Firebase CLI, a fejlesztői gépeken viszont globálisan telepítve van.
      - run: npm i -g firebase-tools@15.24.0
      # Az emulátor JVM-en fut, és a firebase-tools 21-nél régebbi JDK-t már
      # nem fogad el — a runner alapértelmezett Java-ja ennél korábbi.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Minden projekt (app és library-k), nem csak a music-collection.
      - run: npx nx run-many -t lint
      - run: npx nx run-many -t test --passWithNoTests
      - run: npm run build:prod

  # dev branch → dev környezet automatikusan, de csak zöld build-test után.
  # A környezeti változókat (GCP_PROJECT, WIF_PROVIDER, DEPLOYER_SA, BUILD_CONFIG,
  # FIREBASE_HOSTING) az `infra/` tofu-gyökerei írják.
  deploy:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@zssz-soft'
          always-auth: true
      # Ugyanaz, mint a build-test jobban: a @zssz-soft csomagokhoz a
      # GH_PACKAGES_TOKEN secret kell.
      - name: Csomag-registry token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Hiányzik a GH_PACKAGES_TOKEN (vagy NPM_TOKEN) secret — a @zssz-soft csomagokhoz read:packages jogú PAT kell."
            exit 1
          fi
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.NPM_TOKEN }}
      - run: npx nx build music-collection --configuration=${{ vars.BUILD_CONFIG }}
      # A hosting CSP-je hash-sel engedi az index.html két inline darabját
      # (téma-script, inline critical CSS onload). Ha a build mást írt ki,
      # a böngésző némán tiltaná le őket — stílus nélküli oldal, villanó
      # téma —, ezért a deploy itt áll meg, nem a látogatónál.
      - run: npm run verify:csp
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      # A hosting mellett a firebase.json többi része is: Firestore rules és indexek,
      # Storage rules. A functionök külön mennek, alatta.
      - run: npx firebase-tools deploy --only hosting:${{ vars.FIREBASE_HOSTING }},firestore,storage --project ${{ vars.GCP_PROJECT }} --non-interactive
      # A functionök két körben.
      #
      # Egy deploy MINDEN functionnek új revíziót indít, mert egy közös
      # forrás-archívumból élnek: bármelyik fájl változása mindegyikük hash-ét
      # átírja. Minden induló revízió lefoglalja a CPU-ját, amíg a healthcheck
      # le nem fut — a Cloud Run régiós kerete viszont 20 vCPU
      # (`CpuAllocPerProjectRegion`). Kvótaemelést kértünk, de a projekt
      # használati előzménye kevés hozzá (`NOT_ENOUGH_USAGE_HISTORY`).
      #
      # A körökre osztás önmagában nem volt elég: a kvóta nem deployonként,
      # hanem a régióban egyszerre futó összes példányra számít, és az első kör
      # frissen indított példányai a második kör alatt még élnek — 11 + 11
      # ugyanúgy 22. A tényleges megoldás a fél CPU a `setGlobalOptions`-ben
      # (apps/functions/src/index.ts); a két kör az e melletti tartalék, hogy
      # egy új function ne feszítse rögtön a keretet.
      #
      # A névsor a forrásból jön, hogy új functionnél itt ne kelljen átírni
      # semmit. Amit viszont kivesznek a kódból, azt egyik kör sem törli:
      # a `firebase functions:delete` marad kézi lépésnek.
      - name: Functionök deployja két körben (Cloud Run CPU-kvóta)
        # A predeploy (firebase.json) hozza le a @zssz-soft/zs-ai-sdk tarballját
        # a functions forrása mellé — ehhez kell itt a registry-token.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.NPM_TOKEN }}
        run: |
          names=$(grep -o '^export const [a-zA-Z0-9_]*' apps/functions/src/index.ts | awk '{print $3}')
          total=$(echo "$names" | wc -l | tr -d ' ')
          half=$(( (total + 1) / 2 ))
          first=$(echo "$names" | head -n "$half" | sed 's/^/functions:security:/' | paste -sd, -)
          second=$(echo "$names" | tail -n +$((half + 1)) | sed 's/^/functions:security:/' | paste -sd, -)
          echo "Első kör ($half): $first"
          npx firebase-tools deploy --only "$first" --project ${{ vars.GCP_PROJECT }} --non-interactive
          echo "Második kör ($((total - half))): $second"
          npx firebase-tools deploy --only "$second" --project ${{ vars.GCP_PROJECT }} --non-interactive
