<div #unit class="unit">
	@for (compartment of shelf(); track compartment.key) {
		<section class="compartment" [attr.aria-label]="compartment.label">
			<h3 class="label">
				<span class="label-text">{{ compartment.label }}</span>
				<span class="label-count">{{ compartment.spines.length }}</span>
			</h3>

			@defer (on viewport) {
				<div class="cubby">
					@for (spine of compartment.spines; track spine.release.id) {
						<a
							class="spine"
							[class]="'is-' + spine.release.format"
							[class.is-box]="spine.release.boxSet"
							[style.width.px]="spine.width"
							[style.height.px]="spine.height"
							[style.--hue]="spine.hue"
							[attr.href]="spine.href"
							[attr.data-id]="spine.release.id"
							[attr.aria-label]="
								spine.release.artistName +
								' — ' +
								spine.release.title
							"
						>
							<span class="spine-cap" aria-hidden="true"></span>
							<span class="spine-text" aria-hidden="true">
								<span class="spine-title">{{
									spine.release.title
								}}</span>
								<span class="spine-artist">{{
									spine.release.artistName
								}}</span>
							</span>
						</a>
					}
				</div>
			} @placeholder {
				<div class="cubby"></div>
			}
		</section>
	}

	<mc-record-shelf-peek />
</div>
