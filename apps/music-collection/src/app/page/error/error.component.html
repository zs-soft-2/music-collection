<section class="error" aria-labelledby="error-title">
	<i class="pi pi-lock error-icon" aria-hidden="true"></i>
	<p class="eyebrow">musiCollection</p>
	<h1 id="error-title">{{ 'page.error.this-page-is-not' | transloco }}</h1>
	<p class="text">
		{{ 'page.error.it-doesn-t-exist' | transloco }}
	</p>
	<div class="actions">
		<a class="button is-primary" routerLink="/home">{{
			'page.error.go-to-home' | transloco
		}}</a>
		<a class="button" routerLink="/collection">{{
			'page.error.open-collection' | transloco
		}}</a>
	</div>
</section>
