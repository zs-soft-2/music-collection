<dialog
	#dialog
	class="wish"
	aria-labelledby="wishlist-dialog-title"
	[attr.aria-busy]="busy()"
	(close)="closed.emit()"
>
	<header class="wish-header">
		<div>
			<p class="eyebrow">Add to wishlist</p>
			<h2 id="wishlist-dialog-title">{{ albumTitle() }}</h2>
			@if (artistName()) {
				<p class="artist">{{ artistName() }}</p>
			}
		</div>
		<button
			type="button"
			class="icon-button"
			aria-label="Close"
			[disabled]="busy()"
			(click)="close()"
		>
			<i class="pi pi-times" aria-hidden="true"></i>
		</button>
	</header>

	<form (submit)="$event.preventDefault(); submit()">
		<fieldset class="medias">
			<legend>Which format are you after?</legend>
			<div class="chips">
				@for (option of options; track option) {
					<label class="chip">
						<input
							type="checkbox"
							name="media"
							[value]="option"
							[checked]="isPicked(option)"
							(change)="toggleMedia(option)"
						/>
						{{ labels[option] }}
					</label>
				}
			</div>
		</fieldset>

		<label class="field">
			<span>Shop link (optional)</span>
			<input
				type="url"
				inputmode="url"
				placeholder="https://…"
				[value]="sourceLink()"
				[attr.aria-invalid]="linkInvalid()"
				(input)="onLink($event)"
			/>
			@if (linkInvalid()) {
				<span class="field-error">
					Paste a full address, starting with http:// or https://.
				</span>
			}
		</label>

		<p class="hint">
			It lands on your own wishlist. Mark it found there once you have it.
		</p>

		@if (error()) {
			<p class="error" role="alert">Could not add it: {{ error() }}</p>
		}

		<div class="form-actions">
			<button
				type="button"
				class="text-button"
				[disabled]="busy()"
				(click)="close()"
			>
				Cancel
			</button>
			<button
				type="submit"
				class="primary-button"
				[disabled]="linkInvalid() || busy()"
			>
				{{ busy() ? 'Adding…' : 'Add to wishlist' }}
			</button>
		</div>
	</form>
</dialog>
