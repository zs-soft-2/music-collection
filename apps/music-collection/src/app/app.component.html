<!--
	A világ, amiben a lap áll: a lejátszott lemezből épül, és állóképként
	megáll, hacsak a gyűjtő nem kért élőt. Alatta marad a mintás réteg,
	ami akkor is kitölti a lapot, ha nincs jelenet.
-->
<mc-scene-backdrop />
<mc-ambient-backdrop />
<mc-top-bar></mc-top-bar>

<!--
	The reminder that today's question is unanswered: under the bar, where it
	stays in sight while the collector reads something else, until they play
	it or send it away.
-->
<mc-daily-question-banner />

<!--
	A bal oldali navigáció. Széles képernyőn ez a fő menü — csukva áll, és
	a felső sáv gombjára csúszik rá a lapra, nem mellé: a tartalom így
	nem rendeződik át alatta. Keskenyen nem is rajzolódik ki.
-->
<mc-side-rail />

<main>
	<div class="content">
		<router-outlet></router-outlet>
	</div>

	<footer [title]="'app.build' | transloco: { time: buildTime }">
		{{ 'app.version' | transloco: { version } }}
	</footer>
</main>

<!--
	"How was it?" — the question after a record has played right through. In
	the corner rather than under the bar: this one arrives unasked, and a
	collector who wants nothing to do with it should be able to look past it.
-->
<mc-verdict-prompt />

<!--
	A hüvelykujj menüje: öt hely a képernyő alján, telefonon. Nagyobb
	képernyőn nem rajzolódik ki — ott a bal oldali sáv navigál.
-->
<mc-tab-bar />

<mc-error-toast></mc-error-toast>
<mc-consent-bar />

<!--
	The outside players only exist for a signed-in collector who asked for
	them: embedding one writes its owner's storage and reports the visit, so
	the shell keeps them off the page rather than trusting each player to
	check for itself.
-->
@if (players.allowed()) {
	<mc-youtube-dock />

	@if (player.stageOpen()) {
		<mc-player-stage />
	}
}

<!--
	A vezetett bemutató: az indító, a reflektor és a szövegbuborék.

	`@if` és nem `@defer`: a kapcsoló mindkét irányban azonnal hasson. A
	`@defer` a betöltött blokkot már nem bontja le, ha a feltétele hamisra
	fordul — a kikapcsolás így csak újratöltés után vinné el az indítót.
	Maga a séta (a lépések és a szövegkulcsaik) külön chunkban marad: a
	DemoTourService csak akkor kéri le, amikor ez a blokk a lapra kerül.
-->
@if (tour.enabled()) {
	<mc-demo-tour />
}
