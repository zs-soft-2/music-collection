<mc-ambient-backdrop />
<mc-top-bar></mc-top-bar>

<!--
	The reminder that today's question is unanswered: under the bar, where it
	stays in sight while the collector reads something else, until they play
	it or send it away.
-->
<mc-daily-question-banner />

<main>
	<div class="content">
		<router-outlet></router-outlet>
	</div>

	<footer [title]="'app.build' | transloco: { time: buildTime }">
		{{ 'app.version' | transloco: { version } }}
	</footer>
</main>

<mc-error-toast></mc-error-toast>
<mc-consent-bar />

<!--
	The outside players only exist for a signed-in collector who asked for
	them: embedding one writes its owner's storage and reports the visit, so
	the shell keeps them off the page rather than trusting each player to
	check for itself.
-->
@if (players.allowed()) {
	<mc-youtube-dock />

	@if (player.stageOpen()) {
		<mc-player-stage />
	}
}
